<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI SQL Doctor</title>
  <link rel="stylesheet" href="/assets/console.css">
  <script>document.documentElement.lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "zh-CN";</script>
</head>
<body>
  <div class="shell" data-shell="studio">
    <header class="top">
      <div class="brand"><span class="mark">SD</span><div><strong>AI SQL Doctor</strong><small><span class="zh">只分析 PostgreSQL 文本</span><span class="en">PostgreSQL text only</span></small></div></div>
      <nav class="lang"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">English</button></nav>
    </header>
    <main class="layout">
      <section class="panel">
<p class="note"><span class="zh">这里不连接数据库，也不会承诺变快。</span><span class="en">No database connection, and no promise that a query gets faster.</span></p>
<label>SQL</label>
<textarea id="sql">SELECT id FROM orders WHERE name LIKE '%x%'</textarea>
<label>EXPLAIN</label>
<textarea id="explain"></textarea>
<label><span class="zh">左侧记录</span><span class="en">Left report</span></label>
<input id="left" placeholder="id">
<label><span class="zh">右侧记录</span><span class="en">Right report</span></label>
<input id="right" placeholder="id">
<div class="actions">
  <button class="primary" id="diagnose" type="button"><span class="zh">分析</span><span class="en">Diagnose</span></button>
  <button id="history" type="button"><span class="zh">记录列表</span><span class="en">Reports</span></button>
  <button id="compare" type="button"><span class="zh">比较两次计划</span><span class="en">Compare plans</span></button>
</div>
</section>
      <section class="panel"><pre id="out" class="out"></pre></section>
    </main>
  </div>
  <script src="/assets/console.js"></script>
  <script src="/assets/page.js"></script>
</body>
</html>
